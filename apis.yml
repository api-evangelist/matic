aid: matic
name: Matic
description: >-
  Matic is a digital insurance marketplace and independent insurance agency that
  lets consumers compare and buy home, auto, pet, umbrella, jewelry and other
  personal-lines insurance from a network of 60+ A-rated carriers in one place.
  Founded in 2014 and headquartered in Columbus, Ohio, Matic is best known for
  its embedded-insurance model: it integrates insurance shopping into the digital
  experiences of mortgage lenders, servicers, banks and other financial-services
  partners so borrowers and account holders can obtain coverage at the point of
  need. Matic is a licensed agency operating in all 50 states and is backed by
  investors including Anthemis. It was added to the API Evangelist network as a
  portfolio-lead stub; this enrichment pass confirms Matic operates as a
  consumer-facing insurance marketplace with a partner/embedded-insurance
  business but no publicly documented developer API surface.
